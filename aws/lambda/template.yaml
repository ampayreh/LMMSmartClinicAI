AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LMMC Smart Clinic Assistant — AWS Lambda + Bedrock API

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Architecture: arm64
    Environment:
      Variables:
        AWS_DEFAULT_REGION: !Ref AWS::Region
        ROUTER_MODEL: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
        MAIN_MODEL: "us.anthropic.claude-sonnet-4-20250514-v1:0"

Resources:
  LMMCServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ApplyGuardrail
                Resource: '*'

  LMMCServerlessChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./chat/
      Handler: dist/index.handler
      Role: !GetAtt LMMCServiceRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowHeaders:
            - authorization
            - x-client-info
            - apikey
            - content-type
            - x-session-id
          AllowMethods:
            - POST
            - OPTIONS

  LMMCServerlessChatFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LMMCServerlessChatFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  ChatFunctionUrl:
    Description: "Lambda Function URL for LMMC Smart Clinic AI Chat"
    Value: !GetAtt LMMCServerlessChatFunctionUrl.FunctionUrl
